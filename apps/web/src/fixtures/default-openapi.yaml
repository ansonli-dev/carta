openapi: 3.0.3
info:
  title: __API_TITLE__
  version: 1.0.0
  description: |-
    ## Overview

    This sample API is shaped to match the Stoplight Elements demo: rich overview copy,
    grouped endpoints, reusable schemas, request examples, response examples, shared
    parameters, and API key security.

    Use it as a starting point for a project API, then replace resources and schemas
    with your own OpenAPI document.
  contact:
    name: Carta Platform
    email: platform@example.com
  license:
    name: MIT
servers:
  - url: https://api.example.com
    description: Production
  - url: https://sandbox.example.com
    description: Sandbox
security:
  - ApiKeyAuth: []
tags:
  - name: Todos
    description: Task planning and status endpoints.
  - name: Users
    description: User profile endpoints used by the todo workflow.
paths:
  /todos:
    get:
      tags:
        - Todos
      summary: List Todos
      operationId: listTodos
      description: |-
        Returns a paginated list of todos.

        Markdown is supported in descriptions, so API teams can add usage notes,
        rollout guidance, and links to runbooks.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Returns a list of todos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
              examples:
                default:
                  $ref: '#/components/examples/TodoList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Todos
      summary: Create Todo
      operationId: createTodo
      description: Creates a todo item for the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreate'
            examples:
              default:
                $ref: '#/components/examples/TodoCreate'
      responses:
        '201':
          description: Todo created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
              examples:
                default:
                  $ref: '#/components/examples/Todo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /todos/{todoId}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    get:
      tags:
        - Todos
      summary: Get Todo
      operationId: getTodo
      description: Gets a single todo by ID.
      responses:
        '200':
          description: Returns the requested todo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
              examples:
                default:
                  $ref: '#/components/examples/Todo'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Todos
      summary: Replace Todo
      operationId: replaceTodo
      description: Replaces every mutable field on a todo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreate'
      responses:
        '200':
          description: Todo replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Todos
      summary: Update Todo
      operationId: updateTodo
      deprecated: true
      description: Deprecated partial update endpoint kept for compatibility examples.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoUpdate'
      responses:
        '200':
          description: Todo updated.
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Todos
      summary: Delete Todo
      operationId: deleteTodo
      description: Deletes a todo by ID.
      responses:
        '204':
          description: Todo deleted.
        '404':
          $ref: '#/components/responses/NotFound'
  /users:
    get:
      tags:
        - Users
      summary: List Users
      operationId: listUsers
      description: Lists users who can own todos.
      security: []
      responses:
        '200':
          description: Returns users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
        - Users
      summary: Create User
      operationId: createUser
      description: Creates a user profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            examples:
              default:
                $ref: '#/components/examples/UserCreate'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  $ref: '#/components/examples/User'
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users
      summary: Get User
      operationId: getUser
      description: Gets a user by ID.
      responses:
        '200':
          description: Returns the requested user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Users
      summary: Delete User
      operationId: deleteUser
      description: Deletes a user profile.
      responses:
        '204':
          description: User deleted.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Use any demo value, for example `123`.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TodoId:
      name: todoId
      in: path
      required: true
      description: Unique todo identifier.
      schema:
        type: string
        example: todo_123
    UserId:
      name: userId
      in: path
      required: true
      description: Unique user identifier.
      schema:
        type: string
        example: usr_123
  schemas:
    Todo:
      type: object
      required:
        - id
        - title
        - completed
        - owner
        - createdAt
      properties:
        id:
          type: string
          example: todo_123
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 120
          example: Review API changelog
        completed:
          type: boolean
          default: false
        priority:
          type: string
          enum:
            - low
            - medium
            - high
          default: medium
        owner:
          $ref: '#/components/schemas/User'
        dueAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    TodoCreate:
      type: object
      required:
        - title
        - ownerId
      properties:
        title:
          type: string
          example: Review API changelog
        ownerId:
          type: string
          example: usr_123
        priority:
          type: string
          enum:
            - low
            - medium
            - high
        dueAt:
          type: string
          format: date-time
    TodoUpdate:
      type: object
      properties:
        title:
          type: string
        completed:
          type: boolean
        priority:
          type: string
          enum:
            - low
            - medium
            - high
    User:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
      properties:
        id:
          type: string
          readOnly: true
          example: usr_123
        firstName:
          type: string
          example: Avery
        lastName:
          type: string
          example: Stone
        email:
          type: string
          format: email
          example: avery@example.com
        phone:
          type: string
          example: '+1-555-0100'
    UserCreate:
      type: object
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
          example: Avery
        lastName:
          type: string
          example: Stone
        email:
          type: string
          format: email
          example: avery@example.com
        phone:
          type: string
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    Unauthorized:
      description: API key is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                code: unauthorized
                message: Provide a valid API key.
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              value:
                code: not_found
                message: Resource not found.
  examples:
    Todo:
      value:
        id: todo_123
        title: Review API changelog
        completed: false
        priority: high
        owner:
          id: usr_123
          firstName: Avery
          lastName: Stone
          email: avery@example.com
        dueAt: '2026-07-01T09:00:00Z'
        createdAt: '2026-06-23T09:00:00Z'
        updatedAt: '2026-06-23T09:00:00Z'
    TodoList:
      value:
        - id: todo_123
          title: Review API changelog
          completed: false
          priority: high
          owner:
            id: usr_123
            firstName: Avery
            lastName: Stone
            email: avery@example.com
          dueAt: '2026-07-01T09:00:00Z'
          createdAt: '2026-06-23T09:00:00Z'
          updatedAt: '2026-06-23T09:00:00Z'
        - id: todo_456
          title: Publish SDK guide
          completed: true
          priority: medium
          owner:
            id: usr_456
            firstName: Morgan
            lastName: Lee
            email: morgan@example.com
          dueAt: null
          createdAt: '2026-06-20T09:00:00Z'
          updatedAt: '2026-06-22T16:30:00Z'
    TodoCreate:
      value:
        title: Review API changelog
        ownerId: usr_123
        priority: high
        dueAt: '2026-07-01T09:00:00Z'
    User:
      value:
        id: usr_123
        firstName: Avery
        lastName: Stone
        email: avery@example.com
        phone: '+1-555-0100'
    UserCreate:
      value:
        firstName: Avery
        lastName: Stone
        email: avery@example.com
        phone: '+1-555-0100'
